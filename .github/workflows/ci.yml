name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run seo:check
      # Serve the export with the production nginx config and check status codes, redirects and cache headers.
      - name: nginx smoke test
        run: |
          docker run -d --name vt-nginx -p 8080:80 \
            -v "$PWD/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/build/redirects.map:/etc/nginx/redirects.map:ro" \
            -v "$PWD/out:/usr/share/nginx/html:ro" \
            nginx:1.27-alpine
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
          npm run nginx:smoke -- http://127.0.0.1:8080 || { docker logs vt-nginx | tail -50; exit 1; }
