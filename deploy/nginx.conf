# Lowercase registrations (/aircraft/vt-iao) redirect to the canonical page; the map is written at build time.
map_hash_max_size 8192;
map_hash_bucket_size 128;
map $uri $vt_canonical {
  default "";
  include /etc/nginx/redirects.map;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  if ($vt_canonical) {
    return 301 $vt_canonical;
  }

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 1024;

  # Next static export: /aircraft/VT-ANA -> /aircraft/VT-ANA.html
  location / {
    try_files $uri $uri.html $uri/index.html =404;
  }

  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location /data/ {
    add_header Cache-Control "public, max-age=3600";
    add_header Access-Control-Allow-Origin "*";
  }
  error_page 404 /404.html;
}
