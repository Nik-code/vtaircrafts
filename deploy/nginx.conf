# Lowercase registrations (/aircraft/vt-iao) redirect to the canonical page; the map is written at build time.
# map matches strings case-insensitively, so it is only consulted for paths that contain a lowercase letter.
map_hash_max_size 16384;
map_hash_bucket_size 128;
map $uri $vt_canonical {
  default "";
  include /etc/nginx/redirects.map;
}

# Pages are static, so let the CDN keep HTML for an hour (browsers always revalidate). Cloudflare only stores
# HTML when a Cache Rule makes it eligible; with "respect origin" it then follows s-maxage. Without it every
# crawler fetch reaches the origin (the origin slowed and dropped checks during the 26-27 Oct 2026 recrawl).
map $sent_http_content_type $vt_cache_control {
  default "";
  ~^text/html "public, max-age=0, s-maxage=3600, stale-while-revalidate=86400";
  ~^text/xml "public, max-age=0, s-maxage=3600";
  ~^text/plain "public, max-age=0, s-maxage=3600";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Behind Traefik and Cloudflare: keep Location relative so the scheme stays https.
  absolute_redirect off;
  open_file_cache max=20000 inactive=5m;
  open_file_cache_valid 5m;
  add_header Cache-Control $vt_cache_control;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 1024;

  # Next static export: /aircraft/VT-ANA -> /aircraft/VT-ANA.html
  location / {
    try_files $uri $uri.html $uri/index.html =404;
  }

  # Case-sensitive match: a registration path with a lowercase letter.
  location ~ ^/aircraft/[^/]*[a-z][^/]*$ {
    if ($vt_canonical) {
      return 301 $vt_canonical;
    }
    try_files $uri $uri.html $uri/index.html =404;
  }

  # No hyphen, any case: /aircraft/VTDBJ -> /aircraft/VT-DBJ.
  location ~ ^/aircraft/[^/-]+$ {
    if ($vt_canonical) {
      return 301 $vt_canonical;
    }
    try_files $uri $uri.html $uri/index.html =404;
  }

  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location /data/ {
    add_header Cache-Control "public, max-age=3600";
    add_header Access-Control-Allow-Origin "*";
  }
  error_page 404 /404.html;
}
